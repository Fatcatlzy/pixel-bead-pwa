function cDist(r1,g1,b1,r2,g2,b2){
  const rm=(r1+r2)/2,dr=r1-r2,dg=g1-g2,db=b1-b2;
  return(2+rm/256)*dr*dr+4*dg*dg+(2+(255-rm)/256)*db*db;
}
function beadDist(a,b){return cDist(a.r,a.g,a.b,b.r,b.g,b.b);}
function findNearestIn(r,g,b,pal){
  let best=pal[0],bd=Infinity;
  for(const c of pal){const d=cDist(r,g,b,c.r,c.g,c.b);if(d<bd){bd=d;best=c;}}
  return best;
}
function tC(r,g,b){return(.299*r+.587*g+.114*b)>145?'#000':'#fff'}
function tS(r,g,b){return(.299*r+.587*g+.114*b)>145?'0 0 1px rgba(255,255,255,.5)':'0 0 1px rgba(0,0,0,.5)'}

// Deep copy grid
function cloneGrid(g){return g.map(row=>row.slice());}

// Smart color reduction: merge closest pair iteratively
function reduceColors(grid,rows,cols,maxColors){
  let usage={};
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++) usage[grid[y][x].id]=(usage[grid[y][x].id]||0)+1;
  let activeIds=Object.keys(usage);
  if(activeIds.length<=maxColors) return grid;
  const mergedTo={};activeIds.forEach(id=>mergedTo[id]=id);
  while(activeIds.length>maxColors){
    let bestDist=Infinity,mF=null,mT=null;
    for(let i=0;i<activeIds.length;i++)for(let j=i+1;j<activeIds.length;j++){
      const d=beadDist(MARD_MAP[activeIds[i]],MARD_MAP[activeIds[j]]);
      if(d<bestDist){bestDist=d;
        if(usage[activeIds[i]]>=usage[activeIds[j]]){mT=activeIds[i];mF=activeIds[j];}
        else{mT=activeIds[j];mF=activeIds[i];}
      }
    }
    if(!mF)break;
    for(const id in mergedTo)if(mergedTo[id]===mF)mergedTo[id]=mT;
    usage[mT]+=usage[mF];delete usage[mF];
    activeIds=activeIds.filter(id=>id!==mF);
  }
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const t=mergedTo[grid[y][x].id];
    if(t!==grid[y][x].id)grid[y][x]=MARD_MAP[t];
  }
  return grid;
}

// Fine-grained denoise: level 0~6 maps to strength 0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0
// Fractional levels use probability-based replacement
function denoise(grid,rows,cols,sliderVal){
  if(sliderVal===0) return grid;
  const strength=sliderVal*0.5; // 0.5 step: 0.5, 1.0, 1.5, 2.0, 2.5, 3.0
  const passes=Math.ceil(strength); // number of full passes
  const lastPassProb=strength-Math.floor(strength); // fractional part: 0 or 0.5

  for(let p=0;p<passes;p++){
    let changed=false;
    const snap=cloneGrid(grid);
    const isLastPass=(p===passes-1);
    const prob=(isLastPass && lastPassProb>0)?lastPassProb:1.0;

    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
      const cur=snap[y][x].id;
      const nb=[];
      if(y>0)nb.push(snap[y-1][x]);
      if(y<rows-1)nb.push(snap[y+1][x]);
      if(x>0)nb.push(snap[y][x-1]);
      if(x<cols-1)nb.push(snap[y][x+1]);

      const sameCount=nb.filter(n=>n.id===cur).length;

      // Only replace completely isolated pixels (0 same neighbors)
      if(sameCount===0 && nb.length>=2){
        const nCnt={};
        for(const n of nb)if(n.id!==cur)nCnt[n.id]=(nCnt[n.id]||0)+1;
        let bestId=null,bestCnt=0;
        for(const id in nCnt)if(nCnt[id]>bestCnt){bestCnt=nCnt[id];bestId=id;}

        // Need at least 2 neighbors agreeing (strong consensus)
        if(bestId && bestCnt>=2){
          // Apply probability for fractional passes
          if(prob>=1.0 || Math.random()<prob){
            grid[y][x]=MARD_MAP[bestId];
            changed=true;
          }
        }
      }
    }
    if(!changed)break;
  }
  return grid;
}

function renderTable(tblId,grid,rows,cols,cs,fs){
  const tbl=document.getElementById(tblId);let h='';
  for(let y=0;y<rows;y++){h+='<tr>';for(let x=0;x<cols;x++){
    const bd=grid[y][x],tc=tC(bd.r,bd.g,bd.b),ts=tS(bd.r,bd.g,bd.b);
    let bt='1px solid rgba(0,0,0,0.1)',bb=bt,bl=bt,br=bt;
    if(y%10===0)bt='2.5px solid rgba(0,0,0,0.75)';else if(y%5===0)bt='1.5px solid rgba(0,0,0,0.4)';
    if(y===rows-1)bb='2.5px solid rgba(0,0,0,0.75)';else if((y+1)%10===0)bb='2.5px solid rgba(0,0,0,0.75)';else if((y+1)%5===0)bb='1.5px solid rgba(0,0,0,0.4)';
    if(x%10===0)bl='2.5px solid rgba(0,0,0,0.75)';else if(x%5===0)bl='1.5px solid rgba(0,0,0,0.4)';
    if(x===cols-1)br='2.5px solid rgba(0,0,0,0.75)';else if((x+1)%10===0)br='2.5px solid rgba(0,0,0,0.75)';else if((x+1)%5===0)br='1.5px solid rgba(0,0,0,0.4)';
    h+='<td style="background:rgb('+bd.r+','+bd.g+','+bd.b+');color:'+tc+';width:'+cs+'px;height:'+cs+'px;min-width:'+cs+'px;font-size:'+fs+'px;text-shadow:'+ts+';border-top:'+bt+';border-bottom:'+bb+';border-left:'+bl+';border-right:'+br+'">'+bd.id+'</td>';
  }h+='</tr>';}
  tbl.innerHTML=h;
}

function buildLegend(grid,rows,cols,lgId,tbId,tcId){
  const cCnt={};
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++) cCnt[grid[y][x].id]=(cCnt[grid[y][x].id]||0)+1;
  const sorted=Object.entries(cCnt).sort((a,b)=>b[1]-a[1]);
  document.getElementById(tbId).textContent=rows*cols;
  document.getElementById(tcId).textContent=sorted.length;
  const byS={};
  for(const[id,cnt]of sorted){const s=id.replace(/[0-9]/g,'');if(!byS[s])byS[s]=[];byS[s].push({id,cnt});}
  let lh='';
  for(const s of['A','B','C','D','E','F','G','H','M']){
    if(!byS[s])continue;
    const si=SERIES_INFO[s],sCnt=byS[s].reduce((a,b)=>a+b.cnt,0);
    lh+='<div class="ls"><h3>'+si.name+' — 使用 '+byS[s].length+'/'+si.count+' 色，共 '+sCnt+' 颗</h3><div class="lf">';
    byS[s].sort((a,b)=>parseInt(a.id.slice(1))-parseInt(b.id.slice(1)));
    for(const item of byS[s]){
      const c=MARD_MAP[item.id];
      lh+='<div class="lc"><div class="sw" style="background:rgb('+c.r+','+c.g+','+c.b+')"></div><strong>'+item.id+'</strong> '+c.n+' <span style="color:#999">×'+item.cnt+'</span></div>';
    }
    lh+='</div></div>';
  }
  document.getElementById(lgId).innerHTML=lh;
  return{cCnt,sorted};
}

document.getElementById('genB').addEventListener('click',function(){
  if(!loadedImg){alert('请先选择一张图片！');return;}
  const cols=parseInt(document.getElementById('gC').value)||29;
  const maxC=parseInt(document.getElementById('mxC').value)||40;
  const smLv=parseInt(smSlider.value);
  const cs=parseInt(document.getElementById('cS').value)||28;
  const fs=parseInt(document.getElementById('fS').value)||7;
  const img=loadedImg,ratio=img.height/img.width,rows=Math.round(cols*ratio);

  const cv=document.getElementById('hC');cv.width=cols;cv.height=rows;
  const ctx=cv.getContext('2d');
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='medium';
  ctx.drawImage(img,0,0,cols,rows);
  const data=ctx.getImageData(0,0,cols,rows).data;

  // Step 1: Initial nearest-color match
  let gridInit=[];
  for(let y=0;y<rows;y++){const row=[];for(let x=0;x<cols;x++){
    const i=(y*cols+x)*4,a=data[i+3];
    const r=a<128?237:data[i],g=a<128?237:data[i+1],b=a<128?237:data[i+2];
    row.push(findNearestIn(r,g,b,MARD));
  }gridInit.push(row);}

  const bc=new Set();
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)bc.add(gridInit[y][x].id);

  // Step 2: Color reduction → RAW version (no denoise)
  let gridRaw=cloneGrid(gridInit);
  gridRaw=reduceColors(gridRaw,rows,cols,maxC);

  // Step 3: Refined = raw + denoise
  let gridRef=cloneGrid(gridRaw);
  gridRef=denoise(gridRef,rows,cols,smLv);

  gridDataRaw={grid:gridRaw,rows,cols,cs,fs};
  gridDataRef={grid:gridRef,rows,cols,cs,fs};

  // Count
  const rawColors=new Set();const refColors=new Set();
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){rawColors.add(gridRaw[y][x].id);refColors.add(gridRef[y][x].id);}

  // Tip
  const tipBox=document.getElementById('tipBox');
  const smStr=(smLv*0.5).toFixed(1);
  tipBox.innerHTML='💡 初始 <b>'+bc.size+'</b> 种 → 合并后 <b>'+rawColors.size+'</b> 种(原始版) → 去噪后 <b>'+refColors.size+'</b> 种(精细版, 强度'+smStr+') · '+cols+'×'+rows+' = '+(cols*rows)+' 颗';
  tipBox.style.display='block';

  // Render both tables
  renderTable('pxG_raw',gridRaw,rows,cols,cs,fs);
  renderTable('pxG_ref',gridRef,rows,cols,cs,fs);
  document.getElementById('pC').style.display='block';

  // Build both legends
  buildLegend(gridRaw,rows,cols,'lG_raw','tB_raw','tC_raw');
  buildLegend(gridRef,rows,cols,'lG_ref','tB_ref','tC_ref');

  // Show active legend
  const activeTab=document.querySelector('.tab-btn.active').dataset.tab;
  document.getElementById('lA_raw').style.display=activeTab==='raw'?'block':'none';
  document.getElementById('lA_ref').style.display=activeTab==='refined'?'block':'none';

  document.getElementById('expB').style.display='inline-block';
  document.getElementById('expB2').style.display='inline-block';
});

// ==================== Export function ====================
function exportGrid(gd,filename){
  if(!gd)return;
  const{grid,rows,cols,cs,fs}=gd;
  const cCnt={};
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++) cCnt[grid[y][x].id]=(cCnt[grid[y][x].id]||0)+1;
  const sorted=Object.entries(cCnt).sort((a,b)=>b[1]-a[1]);
  const byS={};
  for(const[id,cnt]of sorted){const s=id.replace(/[0-9]/g,'');if(!byS[s])byS[s]=[];byS[s].push({id,cnt});}
  for(const s in byS)byS[s].sort((a,b)=>parseInt(a.id.slice(1))-parseInt(b.id.slice(1)));

  const gridW=cols*cs,canvasW=Math.max(gridW+40,700),legPad=20,topPad=cs*2;
  const legItemW=135,legItemH=20;
  let legTotalH=0;
  for(const s of['A','B','C','D','E','F','G','H','M']){
    if(!byS[s])continue;
    const lc=Math.max(1,Math.floor((canvasW-legPad*2)/legItemW));
    legTotalH+=24+Math.ceil(byS[s].length/lc)*legItemH+8;
  }
  legTotalH+=50;
  const totalH=topPad+rows*cs+legTotalH+30;
  const ec=document.createElement('canvas');ec.width=canvasW;ec.height=totalH;
  const ctx=ec.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvasW,totalH);
  const ox=Math.max(0,(canvasW-gridW)/2);

  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const bd=grid[y][x],px=ox+x*cs,py=topPad+y*cs;
    ctx.fillStyle='rgb('+bd.r+','+bd.g+','+bd.b+')';
    ctx.fillRect(px,py,cs,cs);
    ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=0.5;ctx.strokeRect(px,py,cs,cs);
  }
  for(let y=0;y<=rows;y++){
    if(y%10===0){ctx.strokeStyle='rgba(0,0,0,0.75)';ctx.lineWidth=2.5;}
    else if(y%5===0){ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1.5;}
    else continue;
    ctx.beginPath();ctx.moveTo(ox,topPad+y*cs);ctx.lineTo(ox+cols*cs,topPad+y*cs);ctx.stroke();
  }
  for(let x=0;x<=cols;x++){
    if(x%10===0){ctx.strokeStyle='rgba(0,0,0,0.75)';ctx.lineWidth=2.5;}
    else if(x%5===0){ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1.5;}
    else continue;
    ctx.beginPath();ctx.moveTo(ox+x*cs,topPad);ctx.lineTo(ox+x*cs,topPad+rows*cs);ctx.stroke();
  }
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const bd=grid[y][x];
    ctx.fillStyle=tC(bd.r,bd.g,bd.b);
    ctx.font='bold '+fs+'px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(bd.id,ox+x*cs+cs/2,topPad+y*cs+cs/2);
  }
  let curY=topPad+rows*cs+16;
  ctx.fillStyle='#222';ctx.font='bold 14px system-ui,sans-serif';
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('MARD 拼豆用量统计 — 共 '+(rows*cols)+' 颗，'+sorted.length+' 种颜色',legPad,curY);
  curY+=26;
  for(const s of['A','B','C','D','E','F','G','H','M']){
    if(!byS[s])continue;
    const si=SERIES_INFO[s],sCnt=byS[s].reduce((a,b)=>a+b.cnt,0);
    ctx.fillStyle='#555';ctx.font='bold 11px system-ui,sans-serif';
    ctx.fillText(si.name+' — '+byS[s].length+'/'+si.count+' 色，'+sCnt+' 颗',legPad,curY);
    curY+=18;
    const lc=Math.max(1,Math.floor((canvasW-legPad*2)/legItemW));
    byS[s].forEach((item,i)=>{
      const c=MARD_MAP[item.id];
      const col=i%lc,row=Math.floor(i/lc);
      const ix=legPad+col*legItemW,iy=curY+row*legItemH;
      ctx.fillStyle='rgb('+c.r+','+c.g+','+c.b+')';ctx.fillRect(ix,iy,13,13);
      ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=0.5;ctx.strokeRect(ix,iy,13,13);
      ctx.fillStyle='#333';ctx.font='bold 10px system-ui,sans-serif';
      ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText(item.id+' '+c.n+' ×'+item.cnt,ix+16,iy+7);
    });
    curY+=Math.ceil(byS[s].length/lc)*legItemH+8;
  }
  const link=document.createElement('a');
  link.download=filename;link.href=ec.toDataURL('image/png');link.click();
}

document.getElementById('expB').addEventListener('click',function(){exportGrid(gridDataRef,'MARD_refined.png');});
document.getElementById('expB2').addEventListener('click',function(){exportGrid(gridDataRaw,'MARD_raw.png');});
